<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能医疗咨询系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <h1>🏥 智能医疗咨询系统</h1>
            <p class="subtitle">眼科健康咨询 · 智能分诊 · 在线预约</p>
            <div class="header-actions">
                <div class="role-selector">
                    <label for="roleSelect">🎭 身份：</label>
                    <select id="roleSelect">
                        <option value="patient">患者</option>
                        <option value="doctor">医生</option>
                    </select>
                </div>
                <div class="user-selector">
                    <label for="userSelect" id="userSelectLabel">👤 模拟用户：</label>
                    <select id="userSelect">
                        <option value="">新用户（无历史记录）</option>
                    </select>
                </div>
                <button id="historyBtn" class="btn-secondary">💬 历史记录</button>
                <button id="exportBtn" class="btn-secondary">📄 导出病例</button>
                <button id="resetBtn" class="btn-danger">🔄 重新开始</button>
            </div>
        </div>

        <!-- 历史记录侧边栏 -->
        <div id="historySidebar" class="history-sidebar">
            <div class="history-header">
                <h3>💬 对话历史</h3>
                <button class="close-sidebar" onclick="toggleHistorySidebar()">×</button>
            </div>
            <div class="history-controls">
                <button class="btn-load-history" onclick="loadChatHistory()">🔄 刷新列表</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">
                    <div class="empty-icon">💭</div>
                    <p>暂无历史对话</p>
                    <small>开始新对话后会自动保存</small>
                </div>
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-container">
            <div id="chatMessages" class="chat-messages">
                <!-- 欢迎消息 -->
                <div class="message assistant-message">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-text">
                            您好！我是智能医疗咨询助手。我可以为您提供眼科健康咨询、症状评估和医生预约服务。请告诉我您有什么不舒服的地方？
                        </div>
                        <div class="message-time" id="welcomeTime"></div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="请描述您的症状或健康问题..."
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="btn-send">
                        <span id="sendIcon">📤</span>
                        <span id="sendText">发送</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="status-item">
                <span class="status-label">当前身份：</span>
                <span id="currentRole" class="status-value">患者</span>
            </span>
            <span class="status-item">
                <span class="status-label">当前Agent：</span>
                <span id="currentAgent" class="status-value">-</span>
            </span>
            <span class="status-item">
                <span class="status-label">当前阶段：</span>
                <span id="currentStage" class="status-value">初始化</span>
            </span>
            <span class="status-item">
                <span class="status-label">会话ID：</span>
                <span id="sessionId" class="status-value">未连接</span>
            </span>
        </div>
    </div>

    <!-- 加载动画 -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="loading-spinner"></div>
        <span>AI正在思考...</span>
    </div>

    <!-- JSON预览模态框 -->
    <div id="jsonModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>患者病例数据</h2>
                <button class="modal-close" onclick="closeJsonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="jsonContent"></pre>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="downloadJson()">💾 下载JSON</button>
                <button class="btn-secondary" onclick="closeJsonModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js?v=20251121"></script>
</body>
</html>
