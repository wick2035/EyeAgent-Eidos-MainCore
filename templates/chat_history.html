<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话历史记录 - 智能医疗咨询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .user-type-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .chat-item.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .chat-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chat-title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .chat-status {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active { background: #d4edda; color: #155724; }
        .status-archived { background: #fff3cd; color: #856404; }
        .status-closed { background: #f8d7da; color: #721c24; }

        .chat-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .chat-summary {
            font-size: 12px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .content-header {
            background: #f8f9fa;
            padding: 20px 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .content-header h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }

        .chat-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .info-badge {
            padding: 5px 12px;
            background: #e9ecef;
            border-radius: 6px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            margin-bottom: 25px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-avatar {
            background: #e3f2fd;
        }

        .ai-avatar {
            background: #f3e5f5;
        }

        .message-sender {
            font-weight: 600;
            color: #333;
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .message-order {
            margin-left: auto;
            font-size: 12px;
            color: #999;
            background: #f5f5f5;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .message-content {
            margin-left: 46px;
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .user-message .message-content {
            background: #e3f2fd;
            color: #1565c0;
        }

        .ai-message .message-content {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-selection {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .no-selection-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 滚动条样式 */
        .chat-list::-webkit-scrollbar,
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-list::-webkit-scrollbar-track,
        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover,
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 - 对话列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 对话历史记录</h2>
                <div class="user-type-tabs">
                    <button class="tab-btn active" data-type="patient" onclick="switchUserType('patient')">
                        👤 患者
                    </button>
                    <button class="tab-btn" data-type="doctor" onclick="switchUserType('doctor')">
                        👨‍⚕️ 医生
                    </button>
                </div>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="userIdInput"
                    placeholder="输入患者ID或手机号查询"
                    onkeypress="if(event.key==='Enter') loadChatList()"
                >
            </div>

            <div class="chat-list" id="chatList">
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <p>请输入用户ID查询对话记录</p>
                </div>
            </div>
        </div>

        <!-- 主内容区 - 消息详情 -->
        <div class="main-content">
            <div class="content-header" id="contentHeader" style="display: none;">
                <h1 id="chatTitle">对话标题</h1>
                <div class="chat-info">
                    <span class="info-badge" id="chatAgent">Agent: -</span>
                    <span class="info-badge" id="chatType">类型: -</span>
                    <span class="info-badge" id="chatMessages">消息数: -</span>
                    <span class="info-badge" id="chatTime">时间: -</span>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="no-selection">
                    <div class="no-selection-icon">💭</div>
                    <p>请从左侧选择一个对话查看详情</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserType = 'patient';
        let currentUserId = null;
        let currentChatId = null;

        // 切换用户类型
        function switchUserType(type) {
            currentUserType = type;

            // 更新标签样式
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });

            // 更新搜索框提示
            const input = document.getElementById('userIdInput');
            input.placeholder = type === 'patient' ? '输入患者ID或手机号查询' : '输入医生ID查询';
            input.value = '';

            // 清空列表
            document.getElementById('chatList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <p>请输入用户ID查询对话记录</p>
                </div>
            `;

            // 清空消息区
            showNoSelection();
        }

        // 加载对话列表
        async function loadChatList() {
            const input = document.getElementById('userIdInput').value.trim();
            if (!input) {
                alert('请输入用户ID');
                return;
            }

            const chatList = document.getElementById('chatList');
            chatList.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载对话列表...</p>
                </div>
            `;

            try {
                // 使用新的会话API
                const endpoint = `/api/conversations?host_id=${input}&user_type=${currentUserType}&limit=50&offset=0`;

                const response = await fetch(endpoint);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '查询失败');
                }

                displayChatList(data.conversations || []);
                currentUserId = input;
            } catch (error) {
                chatList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 显示对话列表
        function displayChatList(conversations) {
            const chatList = document.getElementById('chatList');

            if (conversations.length === 0) {
                chatList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>暂无对话记录</p>
                    </div>
                `;
                return;
            }

            let html = '';
            conversations.forEach(conv => {
                const chatId = conv.id;
                const title = conv.title || `对话 #${chatId.substring(0, 8)}`;
                const summary = conv.summary || '暂无摘要';
                const messageCount = conv.total_messages || 0;
                const time = formatDateTime(conv.create_time);

                html += `
                    <div class="chat-item" onclick="loadChatMessages('${chatId}')">
                        <div class="chat-item-header">
                            <span class="chat-title">${title}</span>
                        </div>
                        <div class="chat-meta">
                            💬 ${messageCount} 条消息
                        </div>
                        <div class="chat-summary">${summary}</div>
                        <div class="chat-meta" style="margin-top: 5px;">
                            🕐 ${time}
                        </div>
                    </div>
                `;
            });

            chatList.innerHTML = html;
        }

        // 加载对话消息
        async function loadChatMessages(chatId) {
            currentChatId = chatId;

            // 高亮选中的对话
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            const container = document.getElementById('messagesContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载消息...</p>
                </div>
            `;

            try {
                // 使用新的会话详情API
                const response = await fetch(`/api/conversations/${chatId}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '查询失败');
                }

                displayMessages(data);
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 显示消息
        function displayMessages(data) {
            const conversation = data.conversation;
            const messages = data.messages || [];

            // 更新头部信息
            const chatId = conversation.id;
            document.getElementById('contentHeader').style.display = 'block';
            document.getElementById('chatTitle').textContent = conversation.title || `对话 #${chatId.substring(0, 8)}`;
            document.getElementById('chatAgent').textContent = `用户类型: ${conversation.user_type || '-'}`;
            document.getElementById('chatType').textContent = `Host: ${(conversation.host_id || '').substring(0, 8)}...`;
            document.getElementById('chatMessages').textContent = `消息数: ${conversation.total_messages || 0}`;
            document.getElementById('chatTime').textContent = `时间: ${formatDateTime(conversation.create_time)}`;

            // 显示消息
            const container = document.getElementById('messagesContainer');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <p>暂无消息</p>
                    </div>
                `;
                return;
            }

            let html = '';
            messages.forEach(msg => {
                const isUser = msg.message_type === 'user';
                const avatar = isUser ? '👤' : '🤖';
                const messageClass = isUser ? 'user-message' : 'ai-message';
                const avatarClass = isUser ? 'user-avatar' : 'ai-avatar';
                const sender = msg.sender_id || (isUser ? '用户' : 'AI助手');
                const time = formatDateTime(msg.create_time);

                html += `
                    <div class="message ${messageClass}">
                        <div class="message-header">
                            <div class="message-avatar ${avatarClass}">${avatar}</div>
                            <span class="message-sender">${sender}</span>
                            <span class="message-time">${time}</span>
                            <span class="message-order">#${msg.message_order}</span>
                        </div>
                        <div class="message-content">${escapeHtml(msg.message_content)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = 0;
        }

        // 显示未选择状态
        function showNoSelection() {
            document.getElementById('contentHeader').style.display = 'none';
            document.getElementById('messagesContainer').innerHTML = `
                <div class="no-selection">
                    <div class="no-selection-icon">💭</div>
                    <p>请从左侧选择一个对话查看详情</p>
                </div>
            `;
        }

        // 格式化日期时间
        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
