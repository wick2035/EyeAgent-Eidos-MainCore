spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://1.117.233.43:3306/eye_agent_db
          # url: jdbc:mysql://localhost:3306/eyesApp2
          username: eye_agent_db
          password: 12345678

      hikari:
        maxPoolSize: 20
        minIdle: 10
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        connectionTestQuery: SELECT 1
        keepaliveTime: 30000
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 20      # 最大连接数
          max-idle: 10        # 最大空闲连接
          min-idle: 5         # 最小空闲连接
          max-wait: 2000ms    # 连接池最大阻塞等待时间
  rabbitmq:
    host: 1.117.233.43
    port: 5672
    username: qtcyy
    password: 123456
    virtual-host: /

    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 3
        max-concurrency: 10
    template:
      mandatory: true


